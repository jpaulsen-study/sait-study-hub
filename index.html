<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Flashcards Test</title>
<style>
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #111;
        color: white;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .app {
        width: 100%;
        max-width: 700px;
        text-align: center;
    }

    h1 {
        margin-bottom: 5px;
        font-size: 28px;
    }

    .small {
        color: #ccc;
        font-size: 14px;
        margin-bottom: 20px;
    }

    .card-wrap {
        perspective: 1000px;
        margin: 20px auto;
        width: 100%;
        max-width: 600px;
        height: 300px;
    }

    .card {
        width: 100%;
        height: 100%;
        position: relative;
        transition: transform 0.6s;
        transform-style: preserve-3d;
        cursor: pointer;
    }

    .card.flipped {
        transform: rotateY(180deg);
    }

    .side {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 18px;
        backface-visibility: hidden;
        background: #fff;
        color: #111;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 25px;
        box-sizing: border-box;
        font-size: 28px;
        font-weight: bold;
        border: 4px solid #444;
    }

    .back {
        transform: rotateY(180deg);
        background: #e9e9e9;
    }

    .label {
        position: absolute;
        top: 15px;
        left: 20px;
        font-size: 14px;
        color: #666;
        text-transform: uppercase;
    }

    .controls {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        margin-top: 20px;
    }

    button, select {
        padding: 14px;
        border: none;
        border-radius: 10px;
        font-size: 17px;
        font-weight: bold;
    }

    button {
        background: #f2f2f2;
        color: #111;
        cursor: pointer;
    }

    button:active {
        transform: scale(0.98);
    }

    select {
        background: #222;
        color: white;
        border: 2px solid #555;
        grid-column: span 2;
    }

    .progress {
        margin-top: 15px;
        color: #ccc;
        font-size: 16px;
    }

    .hint {
        margin-top: 15px;
        color: #aaa;
        font-size: 14px;
        line-height: 1.4;
    }

    @media (max-width: 520px) {
        .side {
            font-size: 22px;
        }

        .card-wrap {
            height: 260px;
        }

        .controls {
            grid-template-columns: 1fr;
        }

        select {
            grid-column: span 1;
        }
    }
</style>
</head>
<body>

<div class="app">
    <h1>Audio Flashcards Test</h1>
    <div class="small">Tap the card to flip it, or use Play Card to hear the question and answer.</div>

    <select id="mode">
        <option value="study">Study Mode: question, pause, answer, flip</option>
        <option value="quiz">Quiz Mode: question only until you flip</option>
    </select>

    <div class="card-wrap">
        <div class="card" id="card" onclick="flipCard()">
            <div class="side front">
                <div class="label">Question</div>
                <div id="questionText"></div>
            </div>
            <div class="side back">
                <div class="label">Answer</div>
                <div id="answerText"></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button onclick="playCard()">🔊 Play Card</button>
        <button onclick="flipCard()">🔄 Flip Card</button>
        <button onclick="previousCard()">⬅ Previous</button>
        <button onclick="nextCard()">Next ➡</button>
        <button onclick="shuffleCards()">🔀 Shuffle</button>
        <button onclick="stopAudio()">⏹ Stop Audio</button>
    </div>

    <div class="progress" id="progress"></div>

    <div class="hint">
        Voice uses your browser/device text-to-speech. On iPhone, make sure silent mode is off and volume is up.
    </div>
</div>

<script>
const cards = [
    {
        question: "Which pipe grade has the thickest wall?",
        answer: "XXS. Extra extra strong pipe has the thickest wall."
    },
    {
        question: "Hydrogen sulphide gas has a foul odour similar to what?",
        answer: "Rotten eggs."
    },
    {
        question: "What does CSA stand for?",
        answer: "Canadian Standards Association."
    },
    {
        question: "Lines of latitude are also known as what?",
        answer: "Parallels."
    },
    {
        question: "What is standard atmospheric pressure in psia?",
        answer: "14.7 psia."
    },
    {
        question: "Atmospheric pressure measured in inches of mercury is what?",
        answer: "29.92 inches of mercury absolute."
    },
    {
        question: "Which fitting is used to create a branch in piping?",
        answer: "A tee."
    },
    {
        question: "What is the proper ladder angle ratio?",
        answer: "Four to one is the common safe ladder ratio. One foot out for every four feet up."
    },
    {
        question: "What prevents pipe separation in a grooved piping system?",
        answer: "A keyed coupling."
    },
    {
        question: "What is the minimum frequency to perform a safety plan?",
        answer: "Daily."
    }
];

let current = 0;
let shuffled = false;

function showCard() {
    document.getElementById("card").classList.remove("flipped");
    document.getElementById("questionText").textContent = cards[current].question;
    document.getElementById("answerText").textContent = cards[current].answer;
    document.getElementById("progress").textContent = "Card " + (current + 1) + " of " + cards.length;
    stopAudio();
}

function flipCard() {
    document.getElementById("card").classList.toggle("flipped");
}

function nextCard() {
    current = (current + 1) % cards.length;
    showCard();
}

function previousCard() {
    current = (current - 1 + cards.length) % cards.length;
    showCard();
}

function stopAudio() {
    if ("speechSynthesis" in window) {
        speechSynthesis.cancel();
    }
}

function speak(text, rate = 0.9) {
    return new Promise(resolve => {
        if (!("speechSynthesis" in window)) {
            alert("Speech is not supported in this browser.");
            resolve();
            return;
        }

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = rate;
        utterance.pitch = 1;
        utterance.volume = 1;
        utterance.onend = resolve;
        speechSynthesis.speak(utterance);
    });
}

function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

async function playCard() {
    stopAudio();
    document.getElementById("card").classList.remove("flipped");

    const mode = document.getElementById("mode").value;
    const q = cards[current].question;
    const a = cards[current].answer;

    await speak("Question. " + q);

    if (mode === "study") {
        await wait(4000);
        document.getElementById("card").classList.add("flipped");
        await speak("Answer. " + a);
    }
}

function shuffleCards() {
    stopAudio();
    for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
    }
    current = 0;
    shuffled = true;
    showCard();
}

showCard();
</script>

</body>
</html>
