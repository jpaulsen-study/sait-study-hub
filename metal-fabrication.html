 the five types of welded joints ?","choices":["Fillet weld","Slightly convex","1GR","BCTEL"],"a":3},{"module":"Welding A","q":"What is the most precise method for identifying a metal ?","choices":["3/8 inch","Edge joint","Strength and stress factors","Mill test"],"a":3},{"module":"Welding A","q":"What type of joint is extensively used for joining light gauge sheet metal ?","choices":["Edge joint","Surfacing weld","BCTEL","True"],"a":0},{"module":"Welding A","q":"When should one consider preparing a double welded joint ?","choices":["True","Mill test","To increase joint economy because less filler metal is required","2G"],"a":2},{"module":"Welding A","q":"Whenever a wear surface can be economically reclaimed, the best choice of weld is what ?","choices":["Iron","Slightly convex","With no filler metal","Surfacing weld"],"a":3},{"module":"Welding A","q":"Which term best describes the resistance of a material to a force trying to pull it apart ?","choices":["Iron","To increase joint economy because less filler metal is required","Tensile strength","Slightly convex"],"a":2},{"module":"Welding A","q":"Which type of steel is harder than a file ?","choices":["Hardened tool steel","Pitch","Edge joint","4G"],"a":0},{"module":"Welding A","q":"Which type of weld is used on tee, corner, and lap joints ?","choices":["1GR","Fillet weld","Butt joints","Slightly convex"],"a":1},{"module":"Welding A","q":"Why is it important to understand what is expected for proper fabrication and weldment of a joint ?","choices":["So it will perform to the required standards","A ferrous metal with a low carbon content","Pitch","Mill test"],"a":0},{"module":"Welding B","q":"A flame travelling back from the torch handle to the regulator can be extinguished using what ?","choices":["Higher BTU value makes it ideal.","Rapid oxidation","Flashback arrestors","15 psi"],"a":2},{"module":"Welding B","q":"Above what pressure is acetylene unstable and subject to explosive decomposition ?","choices":["103 kPa  the heating and flowing process","To see the joint clearly during heating","To aid in knowing the temperature of the material"],"a":1},{"module":"Welding B","q":"Oxygen used for cutting operations should have what minimum purity level ?","choices":["95%","98.5%","99%","99.5%"],"a":3},{"module":"Welding B","q":"What would be an ideal fuel to use for heating operations or cutting materials 150 mm (6 inch) thick or greater ?","choices":["Acetylene Gas","MPS Gas","Propane Gas","Natural Gas"],"a":2},{"module":"Welding Safety","q":"When using a torch, you must be careful not to lay it down or hang it up in such a way that:","choices":["The tip can be damaged","The hot tip can burn someone or something","Pressure does not press down on the handle or trigger opening the valves","The torch does not easily get knocked off and fall to the ground damaging it"],"a":2},{"module":"Welding C","q":"What is Arc voltage ?","choices":["Force that strikes up an arc","Force that maintains an arc","Force that melts the parent metal","Force that melts the electrode"],"a":1},{"module":"Brazing & Soldering","q":"Which filler metal would be used primarily for 300-400 series stainless steel ?","choices":["BAg","BCuP","BNi","BAlSi-4"],"a":2},{"module":"Welding Safety","q":"With voltages equal, what type of current is more dangerous ?","choices":["All electricity is dangerous","AC is more dangerous","DC is more dangerous","Current is dangerous"],"a":1},{"module":"Brazing & Soldering","q":"The filler metal designated BAg would fall into which filler metal category ?","choices":["Silver","Gold","Aluminium-silicon","Magnesium"],"a":0},{"module":"Welding Safety","q":"What should you do if you spot a co-worker engaged in unsafe work practices ?","choices":["Nothing","Tell the Foreman","Make your concerns known to the worker","Leave the work area"],"a":2},{"module":"Welding C","q":"What can affect the puddle fluidity ?","choices":["Current","Arc voltage","Polarity","Stinger choice"],"a":0},{"module":"Welding C","q":"Which type of current would one use for SMAW welding ?","choices":["Electrical current","Constant current","Constant voltage","Direct current reverse polarity"],"a":1},{"module":"Brazing & Soldering","q":"Due to its corrosive properties, what should be removed from the brazed joint after it has been completed ?","choices":["Oxidation","Drips of excess metal","Flux","Black discoloration"],"a":2},{"module":"Welding C","q":"Which electrode should have 3%-7% moisture content ?","choices":["No welding electrode should have moisture in it","E6010","E6013","E7018"],"a":1},{"module":"Welding B","q":"When is it good practice to clean the torch tip ?","choices":["When it gets plugged","Before shutting off the torch","Before lighting the torch","Before changing the torch"],"a":2},{"module":"Brazing & Soldering","q":"What does the C indicate with the filler metal designation RBCuP-c ?","choices":["First rod in the filler metal category","Chemical composition of the rod","The braze welding designation","Indicates the filler metal may be used for brazing or braze welding"],"a":1},{"module":"Welding B","q":"Where does a 2 tube cutting torch attachment mix the pre-heat gases ?","choices":["In the tubes","In the tip","In the torch handle","As the gases are ignited"],"a":2},{"module":"Welding Safety","q":"When putting a new grinding wheel on a fixed base grinder or portable grinder, what should one look for ?","choices":["Whether it can be used on the metal to be worked on","The RPM rating of the disk or wheel matches or is greater than the tool RPM rating","The RPM rating of the disk or wheel does not exceed that of the tool","It is not installed backwards"],"a":1},{"module":"Welding A","q":"What is the term used to describe joint misalignment ?","choices":["Low-high","High-low","Side to side","Gap"],"a":1},{"module":"Welding C","q":"What type of current would one use for SMAW welding ?","choices":["DCNP","DCRN","CC","DCAC"],"a":2},{"module":"Brazing & Soldering","q":"What is done to overcome the lack of wet out when torch brazing with high silver content brazing alloys ?","choices":["Use flux to aid in capillary action","Ensure metal is at the proper temperature","Cadmium and zinc are added to the filler metal","Ensure the joint is properly cleaned"],"a":2},{"module":"Welding C","q":"Which type of current flows in one direction during any half cycle and then reverses direction ?","choices":["Amperage","Alternating current","Direct current","Arc voltage"],"a":1},{"module":"Welding A","q":"What is the primary consideration when determining the type of joint and weld that should be used ?","choices":["Strength and load requirements","Whether it is dynamically loaded or statically loaded","Whether the type of weld passes a qualification process","Whether it has been spec'd"],"a":0},{"module":"Brazing & Soldering","q":"If you are looking for a filler rod for general purpose oxy-fuel welding, which rod would you choose ?","choices":["R45","R60","R65","R100"],"a":0},{"module":"Welding B","q":"Can Oxy-Fuel cutting equipment be interchanged between fuel gases ?","choices":["Yes","No","Check with your shop foreman","Check with the manufacturer"],"a":3},{"module":"Brazing & Soldering","q":"Who has developed specifications and classification systems for oxy-fuel, braze welding and fusion welding filler metals ?","choices":["CSA","ASME","ABSA","AWS"],"a":3},{"module":"Welding B","q":"When using a combination cutting attachment, the oxygen valve on the torch handle must be:","choices":["Fully open","Used to balance the flame","Used to control the pre-heat oxygen","Half way open"],"a":0},{"module":"Welding A","q":"What is a spark test mainly used to test for ?","choices":["To test for the type of steel","Test for carbon content in steel","Test for the amount of iron in steel","Test to see if the metal is weld-able"],"a":1},{"module":"Welding C","q":"What can happen if the work lead is loose ?","choices":["Arc hunting","Arc blow","Metallurgic notch effect","Trouble striking an arc"],"a":1},{"module":"Welding C","q":"The movement of electrons in a DC current flows from:","choices":["Negative to positive","Positive to negative","They orbit around the nucleus","Protons are moving"],"a":0},{"module":"Welding C","q":"What is one function of slag ?","choices":["Prevent oxides and nitrides from forming","Self-regulate the arc length","Aid in striking an arc","Float slag to the surface"],"a":0},{"module":"Welding C","q":"Where would one place a welding power source in a shop ?","choices":["On the proper cart","Clean, well ventilated location","Where it can be properly grounded","Close to the power outlet"],"a":1},{"module":"Welding B","q":"What is the term used to describe oxy-fuel cutting ?","choices":["Kindling Point","Rapid oxidation","Oxy Cutting","Torch cutting"],"a":1},{"module":"Welding C","q":"Which electrode is designed for vertical down welding ?","choices":["E7042","E7018","E6013","E6012"],"a":0},{"module":"Welding Safety","q":"Who is responsible for the safety of everyone in the shop ?","choices":["Plant superintendent","Alberta Occupational Health & Safety","Shop Foreman","Individual Worker"],"a":3},{"module":"Welding Safety","q":"What type of radiant energy can cause retina damage ?","choices":["Visible Light","Infrared Rays","Ultraviolet Rays","Arc Light"],"a":1},{"module":"Welding C","q":"If you are using E6010 to test for machine polarity, what would you listen for ?","choices":["Loud hissing sounds","Shallow penetration","Normal heat settings","Less spatter"],"a":0},{"module":"Welding B","q":"What is the most popular welding and cutting torch ?","choices":["The combination welding and cutting torch","Standard cutting torches","Acetylene welding and cutting torches","Semi-automatic cutting torches"],"a":0},{"module":"Welding A","q":"Welding electrodes are put into which 2 categories ?","choices":["Stick and TIG","AWS and CSA","Consumable and non-consumable","Ferrous and non-ferrous"],"a":2},{"module":"Welding C","q":"What is the difference between E7018 and E7014 ?","choices":["Flux coating","Weld position","Strength requirements","Cost"],"a":0},{"module":"Welding C","q":"Which weld electrode would be used for a weld in the overhead position if it required a fast freeze property ?","choices":["E6010","E7024","E7030","E6022"],"a":0},{"module":"Welding Safety","q":"What personal hazard exists with work related to welding ?","choices":["Excessive heat","Burns and eye injuries","Personality injury","Accumulation of hot slag"],"a":1},{"module":"Welding Safety","q":"When using a cut-off saw to cut angle iron, how should it be clamped in the cut-off saw ?","choices":["One vertical leg should be against the stationary block and the other leg lies on the tool base","There are multiple ways to clamp angle iron","One vertical leg should be against the movable block and the other leg lies on the tool base","It should be upside down, so the angle point is straight up"],"a":0},{"module":"Brazing & Soldering","q":"In general, what should be the torch angle while brazing ?","choices":["Same angle as brazing joint","1/4 of the joint angle","1/2 of the joint angle","Twice the joint angle"],"a":2},{"module":"Brazing & Soldering","q":"What type of fumes can be toxic while brazing ?","choices":["Silver fumes","Cadmium fumes","Aluminium fumes","Copper fumes"],"a":1},{"module":"Welding A","q":"A crane would be an example of what type of loading being exerted on the structure ?","choices":["Dynamic loading","Static loading","Shock loading","Stress loading"],"a":0},{"module":"Welding A","q":"Where would you expect to find information on weld orientation ?","choices":["The weld tail","The shop drawing","The reference line","The Civil engineer"],"a":1},{"module":"Welding Safety","q":"What should you do whenever you set an object aside that could potentially burn others ?","choices":["Stop, Drop, Roll","Mark HOT with chalk or soapstone","Place out of the way","Place under the workbench"],"a":1},{"module":"Welding A","q":"While conducting a spark test, a metal with a high carbon content would:","choices":["Produce no sparks","Produce a long spark stream","Produce a short spark stream with a burst formation","Produce a burst spark formation"],"a":2},{"module":"Welding C","q":"In which polarity is 2/3 of the arc energy associated with the electrode ?","choices":["Straight polarity","Reverse polarity","Alternating current","Constant current"],"a":0},{"module":"Welding A","q":"What type of weld would be used on a tee joint requiring full joint strength ?","choices":["Continuous fillet weld","Intermittent fillet weld","Plug weld","Slot weld"],"a":0},{"module":"Welding C","q":"Which electrode would you use to check for machine polarity ?","choices":["E7010","E7018","E6013","E7024"],"a":0},{"module":"Welding B","q":"What is the likely problem if the kerf edges are melting back together behind the oxy-fuel cut ?","choices":["The tip is too large for the material thickness","The oxygen pressure is too high","The travel speed is too fast","The torch angle is too steep"],"a":0},{"module":"Welding C","q":"What is the main cause of arc blow ?","choices":["Electrical current travelling in the same direction for too long causing magnetic fields to form","Low amperage settings","Excessive electrode moisture","Poor weld appearance"],"a":0}];
let deck=[...ALL_CARDS],index=0,correct=0,answered={};const $=id=>document.getElementById(id);
function init(){updateAudioUI();let mods=["All Modules","Welding Safety","Welding A","Welding B","Welding C","Brazing & Soldering"];$('moduleFilter').innerHTML=mods.map(m=>`<option>${m}</option>`).join('');$('moduleFilter').onchange=filterDeck;$('mode').onchange=render;render();}
function filterDeck(){let m=$('moduleFilter').value;deck=m==='All Modules'?[...ALL_CARDS]:ALL_CARDS.filter(c=>c.module===m);index=0;resetScore(false);render();}
function render(){if(!deck.length)return;let c=deck[index],study=$('mode').value==='study';$('moduleName').textContent=c.module;$('counter').textContent=`Question ${index+1} of ${deck.length}`;$('num').textContent=index+1;$('total').textContent=deck.length;$('feedback').textContent='';$('answerBox').style.display='none';$('quizArea').style.display=study?'none':'block';$('studyArea').style.display=study?'block':'none';$('flipCard').classList.remove('flipped');$('studyQ').textContent=c.q;$('studyA').textContent=String.fromCharCode(97+c.a)+') '+c.choices[c.a];$('question').textContent=c.q;buildChoices(c);updateStats();setTimeout(()=>speakQuestion(false),250);}
function buildChoices(c){let h=$('choices');h.innerHTML='';c.choices.forEach((ch,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(97+i)+') '+ch;b.onclick=()=>choose(i);h.appendChild(b);});if(answered[index]!==undefined)markChoices(answered[index]);}
function choose(i){if($('mode').value==='study')return flipStudyCard();if(answered[index]!==undefined)return;answered[index]=i;if(i===deck[index].a)correct++;markChoices(i);showAnswer(true);speakResult(i,false);updateStats();}
function markChoices(chosen){let c=deck[index],bs=document.querySelectorAll('.choice');bs.forEach((b,i)=>{b.disabled=true;if(i===c.a)b.classList.add('correct');if(i===chosen&&i!==c.a)b.classList.add('wrong');});$('feedback').textContent=chosen===c.a?'Correct':'Incorrect';}
function showAnswer(){let c=deck[index];if($('mode').value==='study'){$('flipCard').classList.add('flipped');return;}$('answerBox').innerHTML='<b>Correct Answer:</b> '+String.fromCharCode(97+c.a)+') '+esc(c.choices[c.a]);$('answerBox').style.display='block';}
function flipStudyCard(){$('flipCard').classList.toggle('flipped');setTimeout(()=>speakCurrentCard(false),100);}
function nextCard(){index=(index+1)%deck.length;render();}function prevCard(){index=(index-1+deck.length)%deck.length;render();}
function shuffleDeck(){for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}index=0;resetScore(false);render();}
function resetScore(r=true){correct=0;answered={};if(r)render();updateStats();}
function updateStats(){let done=Object.keys(answered).length;$('right').textContent=correct;$('done').textContent=done;$('left').textContent=deck.length-done;}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}

let audioOn=localStorage.getItem('weldAudioOn')==='1';
function updateAudioUI(){if($('audioStatus'))$('audioStatus').textContent=audioOn?'On':'Off';if($('audioBtn'))$('audioBtn').textContent=audioOn?'🔊  Audio On':'🔇  Audio Off';}
function toggleAudio(){audioOn=!audioOn;localStorage.setItem('weldAudioOn',audioOn?'1':'0');if(!audioOn&&'speechSynthesis'in window)speechSynthesis.cancel();updateAudioUI();if(audioOn)speakCurrentCard(true);}
function speakText(t,force=false){if(!force&&!audioOn)return;if(!('speechSynthesis'in window))return;t=String(t).replace(/\\s*\\?/g,' ?').replace(/:/g,' : ').replace(/\\.\\s*/g,'. ');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.92;u.pitch=1;u.volume=1;let vs=speechSynthesis.getVoices();let v=vs.find(x=>x.lang&&x.lang.toLowerCase().startsWith('en'));if(v)u.voice=v;speechSynthesis.speak(u);}
function ansLabel(c){return c.choices[c.a];}
function speakQuestion(force=false){let c=deck[index];speakText(c.q,force);}
function speakAnswer(force=false){let c=deck[index];speakText(ansLabel(c),force);}
function speakResult(chosen,force=false){let c=deck[index];let t=chosen===c.a?'Correct. ':'Incorrect. The correct answer is. ';speakText(t+ansLabel(c),force);}
function speakCurrentCard(force=false){if($('mode').value==='study'&&$('flipCard').classList.contains('flipped'))speakAnswer(force);else speakQuestion(force);}

function goHome(){window.location.href="https://jpaulsen-study.github.io/sait-study-hub/";}

document.onkeydown=e=>{if(e.key==='ArrowRight')nextCard();if(e.key==='ArrowLeft')prevCard();if(e.key===' '||e.key==='Enter'){e.preventDefault();showAnswer();}};init();
</script></body></html>
