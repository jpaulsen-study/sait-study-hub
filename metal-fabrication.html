?","choices":["Flux left in refrigeration assemblies may react with the refrigerant or cause blockage of lines or orifices","You do not require flux on clean copper to copper brazing operations","The flux is corrosive and could corrode the joint causing a leak in the future","It could flow out of the joint and leave higher melting temperature metal behind resulting in pin hole leaks"],"a":0},{"module":"Brazing & Soldering","q":"Specifications and classification systems for oxyfuel brazing and braze-welding filler metals are developed by:","choices":["CSA","ASME","AWS","ASTM"],"a":2},{"module":"Welding B","q":"Solid one-piece cutting tips are used on which oxyfuel cutting torch type?","choices":["Acetylene","Propane","Natural gas","MAPP"],"a":0},{"module":"Welding C","q":"Which cable would you connect first to the welding power source, if you are using #4 and 4/0 welding cables tied together?","choices":["#4","4/0","It does not matter","Only qualified electricians can tie cables together"],"a":1},{"module":"Welding Safety","q":"If exposed to extreme heat, even though you are wearing leather gauntlet style gloves, you can still experience burns. What can be used to help protect your hands from the heat?","choices":["Wool gloves","Gloves with a lined back","TIG type gloves","Roper style gloves"],"a":1},{"module":"Welding C","q":"If a welding power source is rated for 300 amps and can weld for 7 minutes before it needs to cool down, what is the machine's duty cycle?","choices":["30 %","40 %","60 %","70 %"],"a":3},{"module":"Welding C","q":"If moisture were to be drawn into a lime coated electrode, what could be a possible problem?","choices":["Hydrogen induced cracking","They require 3 % - 7 % moisture","Put the electrodes into a reheat oven","There would not be any problem"],"a":0},{"module":"Welding B","q":"Oxygen cylinders are formed from a single piece of steel, using a process known as:","choices":["Short drawn","Long drawn","Hot drawn","Cold drawn"],"a":2},{"module":"Brazing & Soldering","q":"One of the steps involved for a properly brazed joint, to ensure capillary action takes place, includes?","choices":["Using the recommended joint clearances for the brazing filler metal you are using","Use the proper amount of flux","Do not use materials that have differing thermal expansion rates","Ensure the fuel gas being used is acetylene, because it has the hottest flame temperature"],"a":0},{"module":"Welding A","q":"Which welding process employs a two-step process to repair equipment?","choices":["Plug","Surfacing","Fillet","Groove"],"a":1},{"module":"Brazing & Soldering","q":"Lead-bearing solder used on potable waterlines shall not contain lead in excess of:","choices":["0.2 %","0.3 %","0.5 %","1 %"],"a":0},{"module":"Brazing & Soldering","q":"What difference is there between braze welding and soldering?","choices":["Capillary action is not used in braze welding","Capillary action is not used in soldering","More heat is used for soldering","Soldering requires a cleaner joint"],"a":0},{"module":"Welding A","q":"A material having metallic characteristics and is made up of two or more elements, at least one of which is a metal, is the proper definition of:","choices":["Mineral","Alloy","Bronze","Base metal"],"a":1},{"module":"Welding B","q":"The maximum draw limit of ____ volumetric capacity per hour, prevents acetone from leaving an acetylene cylinder.","choices":["1/4","1/5","1/6","1/7"],"a":3},{"module":"Welding A","q":"In a spark test, which type of steel produces darker yellow-orange sparks, bursts nearer the wheel, and some sparks following around the wheel?","choices":["High carbon content steel","Low carbon content steel","Ferrous metal","Non-ferrous metal"],"a":0},{"module":"Welding B","q":"How far away from the workpiece should preheat inner cone flames be when starting the cut?","choices":["1/16 \"","3/16 \"","1/4 \"","3/8 \""],"a":0},{"module":"Welding A","q":"Which of the following are not used in gas cylinder identification?","choices":["Stencilling","Stamping","Labelling","Colour coding"],"a":3},{"module":"Welding C","q":"Which electrode would you use in Any position?","choices":["E7024","E6038","E6040","E7014"],"a":3},{"module":"Welding C","q":"The path electrical current takes through the body can be deadly. How much time does one have before electrocution can be fatal?","choices":["1-3 seconds","15-30 seconds","1-2 minutes","2-5 minutes"],"a":0},{"module":"Welding B","q":"Cylinder pressure for gas manifold systems must be:","choices":["Different pressures","Alternating pressures","The same pressures","Low pressures on one side"],"a":2},{"module":"Welding C","q":"Which electrode would you use in a horizontal fillet weld?","choices":["E4924","E4948","E4933","E4348"],"a":0},{"module":"Welding C","q":"Where do some of the most serious hazards faced during the welding process come from?","choices":["Harmful flags","Hot slag","Hot sparks","Harmful light rays"],"a":3},{"module":"Brazing & Soldering","q":"What is the main purpose of applying flux to a joint before brazing or soldering?","choices":["To aid in capillary action","To aid in the wetting action","To prevent oxides from forming during the flowing and heating process","To help clean the metal"],"a":2},{"module":"Welding B","q":"If slag is bubbling to the surface of the oxyfuel cut, the likely cause is:","choices":["Too much heat","Travel speed too slow","Cutting tip too small","Cutting tip too large"],"a":2},{"module":"Welding Safety","q":"What should you do if your clothing catches fire?","choices":["Stop, Drop, Roll","Get a fire blanket to smother the flames","Get your burning clothes off as quick as possible","Scream like a baby"],"a":0},{"module":"Welding Safety","q":"Because they cover up your wrists, which gloves would provide the best protection?","choices":["Leather","Mechanics style","Aluminized","Leather gauntlet"],"a":3},{"module":"Welding B","q":"Single-stage gas regulators are most common on:","choices":["Manifold systems","Individual oxyfuel outfits","Steel systems","Brass systems"],"a":1},{"module":"Brazing & Soldering","q":"When choosing an oxyfuel filler rod, it is advisable to match the filler metal to the parent metal, with consideration to:","choices":["Colour","Chemistry","Flux requirement","Softness"],"a":1},{"module":"Welding B","q":"What is the pressure safety device in an oxygen cylinder valve?","choices":["Back seating seal","Metal rupture disc","Temperature and pressure relief","Fusible metal plug"],"a":1},{"module":"Welding Safety","q":"Cadmium poisoning can be fatal. Welding on which metal can produce Cadmium poisoning?","choices":["Aluminium","Stainless Steel","Carbon Steel","Chromium"],"a":1},{"module":"Welding C","q":"What should be used to periodically blow out the internal components of a welding power source?","choices":["High volume, low-pressure air","A fan","A rectifier","Oxygen"],"a":0},{"module":"Welding C","q":"What happens to voltage when the arc length is too short?","choices":["Voltage goes up, amps go down","Voltage goes down, amps go up","Voltage and amperage stay the same","Voltage goes down, amperage stays the same"],"a":1},{"module":"Welding A","q":"What does pitch mean on an intermittent fillet weld?","choices":["The centre-to-centre spacing between welds","The depth of penetration","The length of one weld only","The throat size of the weld"],"a":0}];
let deck=[...ALL_CARDS],index=0,correct=0,answered={};const $=id=>document.getElementById(id);
function init(){updateAudioUI();updateAutoStudyUI();let mods=["All Modules","Welding Safety","Welding A","Welding B","Welding C","Brazing & Soldering"];$('moduleFilter').innerHTML=mods.map(m=>`<option>${m}</option>`).join('');$('moduleFilter').onchange=filterDeck;$('mode').onchange=()=>{clearAutoStudyTimers();render();};render();}
function filterDeck(){let m=$('moduleFilter').value;deck=m==='All Modules'?[...ALL_CARDS]:ALL_CARDS.filter(c=>c.module===m);index=0;resetScore(false);render();}
function render(){clearAutoStudyTimers();if(!deck.length)return;let c=deck[index],study=$('mode').value==='study';$('moduleName').textContent=c.module;$('counter').textContent=`Question ${index+1} of ${deck.length}`;$('num').textContent=index+1;$('total').textContent=deck.length;$('feedback').textContent='';$('answerBox').style.display='none';$('quizArea').style.display=study?'none':'block';$('studyArea').style.display=study?'block':'none';$('flipCard').classList.remove('flipped');$('studyQ').textContent=c.q;$('studyA').textContent=String.fromCharCode(97+c.a)+') '+c.choices[c.a];$('question').textContent=c.q;buildChoices(c);updateStats();updateAutoStudyUI();setTimeout(()=>speakQuestion(false),250);startAutoStudyTimers();}
function buildChoices(c){let h=$('choices');h.innerHTML='';c.choices.forEach((ch,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(97+i)+') '+ch;b.onclick=()=>choose(i);h.appendChild(b);});if(answered[index]!==undefined)markChoices(answered[index]);}
function choose(i){if($('mode').value==='study')return flipStudyCard();if(answered[index]!==undefined)return;answered[index]=i;if(i===deck[index].a)correct++;markChoices(i);showAnswer(true);speakResult(i,false);updateStats();}
function markChoices(chosen){let c=deck[index],bs=document.querySelectorAll('.choice');bs.forEach((b,i)=>{b.disabled=true;if(i===c.a)b.classList.add('correct');if(i===chosen&&i!==c.a)b.classList.add('wrong');});$('feedback').textContent=chosen===c.a?'Correct':'Incorrect';}
function showAnswer(){let c=deck[index];if($('mode').value==='study'){$('flipCard').classList.add('flipped');return;}$('answerBox').innerHTML='<b>Correct Answer:</b> '+String.fromCharCode(97+c.a)+') '+esc(c.choices[c.a]);$('answerBox').style.display='block';}
function flipStudyCard(){$('flipCard').classList.toggle('flipped');setTimeout(()=>speakCurrentCard(false),1000);}
function nextCard(){index=(index+1)%deck.length;render();}function prevCard(){index=(index-1+deck.length)%deck.length;render();}
function shuffleDeck(){for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}index=0;resetScore(false);render();}
function resetScore(r=true){correct=0;answered={};if(r)render();updateStats();}
function updateStats(){let done=Object.keys(answered).length;$('right').textContent=correct;$('done').textContent=done;$('left').textContent=deck.length-done;}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}


let autoStudyOn=localStorage.getItem('weldAutoStudyOn')==='1',autoFlipTimer=null,autoNextTimer=null;
function clearAutoStudyTimers(){if(autoFlipTimer)clearTimeout(autoFlipTimer);if(autoNextTimer)clearTimeout(autoNextTimer);autoFlipTimer=null;autoNextTimer=null;}
function updateAutoStudyUI(){let b=$('autoStudyBtn');if(!b)return;let study=$('mode')&&$('mode').value==='study';b.textContent=autoStudyOn?'⏱️ Auto Study On':'⏱️ Auto Study Off';b.disabled=!study;b.title=study?'Flips after 5 seconds and moves to the next question after 10 seconds':'Auto Study only works in Study Mode';}
function toggleAutoStudy(){autoStudyOn=!autoStudyOn;localStorage.setItem('weldAutoStudyOn',autoStudyOn?'1':'0');updateAutoStudyUI();clearAutoStudyTimers();startAutoStudyTimers();}
function startAutoStudyTimers(){clearAutoStudyTimers();if(!autoStudyOn||$('mode').value!=='study')return;autoFlipTimer=setTimeout(()=>{if($('mode').value==='study'){$('flipCard').classList.add('flipped');speakAnswer(false);}},5000);autoNextTimer=setTimeout(()=>{if($('mode').value==='study')nextCard();},10000);}

let audioOn=localStorage.getItem('weldAudioOn')==='1';
function updateAudioUI(){if($('audioStatus'))$('audioStatus').textContent=audioOn?'On':'Off';if($('audioBtn'))$('audioBtn').textContent=audioOn?'🔊  Audio On':'🔇  Audio Off';}
function toggleAudio(){audioOn=!audioOn;localStorage.setItem('weldAudioOn',audioOn?'1':'0');if(!audioOn&&'speechSynthesis'in window)speechSynthesis.cancel();updateAudioUI();if(audioOn)speakCurrentCard(true);}
function speakText(t,force=false){if(!force&&!audioOn)return;if(!('speechSynthesis'in window))return;t=String(t).replace(/\\s*\\?/g,' ?').replace(/:/g,' : ').replace(/\\.\\s*/g,'. ');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.rate=.80;u.pitch=1;u.volume=1;let vs=speechSynthesis.getVoices();let v=vs.find(x=>x.lang&&x.lang.toLowerCase().startsWith('en'));if(v)u.voice=v;speechSynthesis.speak(u);}
function ansLabel(c){return c.choices[c.a];}
function speakQuestion(force=false){let c=deck[index];speakText(c.q,force);}
function speakAnswer(force=false){let c=deck[index];speakText(ansLabel(c),force);}
function speakResult(chosen,force=false){let c=deck[index];let t=chosen===c.a?'Correct. ':'Incorrect. The correct answer is. ';speakText(t+ansLabel(c),force);}
function speakCurrentCard(force=false){if($('mode').value==='study'&&$('flipCard').classList.contains('flipped'))speakAnswer(force);else speakQuestion(force);}

function goHome(){window.location.href="https://jpaulsen-study.github.io/sait-study-hub/";}

document.onkeydown=e=>{if(e.key==='ArrowRight')nextCard();if(e.key==='ArrowLeft')prevCard();if(e.key===' '||e.key==='Enter'){e.preventDefault();showAnswer();}};init();
</script></body></html>
