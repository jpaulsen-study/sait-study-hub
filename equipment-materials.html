ctors?","a":"The size and type of abrasive and the type of bonding agent"},{"m":"Power Tools","q":"What safety specification should be checked when selecting a grinding stone or disc?","a":"The RPM rating of the stone or disc"},{"m":"Power Tools","q":"What is a dressing tool used for?","a":"Refacing the surface of grindstones"},{"m":"Power Tools","q":"Bouncing or heavy vibration while grinding indicates the grindstone is what?","a":"Out of round"},{"m":"Power Tools","q":"Before installing a new grindstone, what should you do?","a":"Inspect the wheel for cracks"},{"m":"Power Tools","q":"When is the risk of a drill bit grabbing the workpiece greatest?","a":"As the bit is breaking through the workpiece"},{"m":"Power Tools","q":"When drilling holes in round material, what should be used?","a":"A V-block"},{"m":"Power Tools","q":"Hand drills are rated by what?","a":"Size of the chuck"},{"m":"Power Tools","q":"Tapered shanks are most common on what drill bits?","a":"Large drill bits"},{"m":"Power Tools","q":"Why are slots provided in a drill press table?","a":"For clamping jigs to the table"},{"m":"Power Tools","q":"When is a magnetic base drill press most advantageous?","a":"When holes are drilled in the vertical plane"},{"m":"Power Tools","q":"What is the main reason for using templates when forming steel?","a":"Maintain accuracy"},{"m":"Power Tools","q":"What is an advantage of a vertical band saw?","a":"It can be used to cut curves"},{"m":"Power Tools","q":"Safe cutting of angle iron in a cut-off saw requires what positioning?","a":"One vertical leg against the stationary block of the clamping device"},{"m":"Power Tools","q":"Air tool governors are most likely found on what tool?","a":"Grinders"},{"m":"Power Tools","q":"What is the most important item to consider in maintaining a chipping hammer?","a":"Piston"},{"m":"Power Tools","q":"Most air tools are designed to operate at what pressure?","a":"90 psi"},{"m":"Welded Pipe & Fittings","q":"Centre-to-face formula for a 90° long-radius butt weld elbow?","a":"NPS × 1.5"},{"m":"Welded Pipe & Fittings","q":"Centre-to-face formula for a 45° long-radius butt weld elbow?","a":"NPS × 5/8"},{"m":"Welded Pipe & Fittings","q":"Centre-to-face formula for a 90° short-radius butt weld elbow?","a":"NPS × 1"},{"m":"Welded Pipe & Fittings","q":"Do all unions require a gasket to ensure a proper seal?","a":"No"},{"m":"Welded Pipe & Fittings","q":"In a 6 inch × 6 inch × 3 inch standard butt weld tee, what does the 3 inch indicate?","a":"The branch outlet size"},{"m":"Welded Pipe & Fittings","q":"Fitting allowance for the branch opening of the above tee?","a":"4 1/8 inches"},{"m":"Welded Pipe & Fittings","q":"Fitting allowance for a 2 inch 3000# socket-weld tee?","a":"1 1/2 inches"},{"m":"Welded Pipe & Fittings","q":"A Class 6000 threaded coupling is not equivalent to any schedule, but what is its weight designation?","a":"XXS"},{"m":"Welded Pipe & Fittings","q":"A Class 6000 socket-weld coupling is equivalent to what pipe schedule?","a":"Schedule 160"},{"m":"Welded Pipe & Fittings","q":"What are the accepted steps for making a butt weld joint?","a":"Measure, Mark, Cut, Ream, Bevel, Fit-Up, Tack"},{"m":"Welded Pipe & Fittings","q":"What is a wraparound used for?","a":"Marking the cut path around a pipe"},{"m":"Welded Pipe & Fittings","q":"Typical land width for a butt weld?","a":"1/8 inch"},{"m":"Welded Pipe & Fittings","q":"When should the gap rod be removed from a butt weld?","a":"After the second tack"},{"m":"Welded Pipe & Fittings","q":"Recommended bevel angle on the end of a pipe?","a":"37.5°"},{"m":"Welded Pipe & Fittings","q":"Does a socket-weld fitting have weld locations inside and outside?","a":"No"},{"m":"Welded Pipe & Fittings","q":"Another name for a Van Stone flange?","a":"Lap-joint flange"},{"m":"Welded Pipe & Fittings","q":"Can a screwed companion flange be found on an 8 inch 900 psi flanged joint?","a":"False"},{"m":"Welded Pipe & Fittings","q":"Raised face height on a 600# RFWN flan  Grooved Pipe","q":"Copper-bearing alloy steel contains approximately how much copper?","a":"0.25%"},{"m":"Threaded & Grooved Pipe","q":"Stainless steel alloying elements?","a":"Chromium and Nickel"},{"m":"Threaded & Grooved Pipe","q":"Chrome-moly steel alloying elements?","a":"Chromium and Molybdenum"},{"m":"Threaded & Grooved Pipe","q":"Four common pipe end finishes?","a":"Plain End, Bevel End, Threaded, Threaded & Coupled"},{"m":"Threaded & Grooved Pipe","q":"Four common pipe surface finishes?","a":"Galvanized, Pickled & Oiled, Painted, Asphalt/Bitumen"},{"m":"Threaded & Grooved Pipe","q":"Distance from one thread crest to the next?","a":"Pitch"},{"m":"Threaded & Grooved Pipe","q":"Male threads are located where?","a":"On the outside of the pipe"},{"m":"Threaded & Grooved Pipe","q":"Female threads are located where?","a":"On the inside of the fitting"},{"m":"Threaded & Grooved Pipe","q":"Thread inside a fitting is called?","a":"Female tapered thread or F.I.P."},{"m":"Threaded & Grooved Pipe","q":"Thread on the outside of a pipe is called?","a":"Male tapered thread or M.I.P."},{"m":"Threaded & Grooved Pipe","q":"How many turns should a fitting go on by hand?","a":"4 to 6 1/4 turns"},{"m":"Threaded & Grooved Pipe","q":"How many wrench turns after hand tightening?","a":"2 to 3 turns"},{"m":"Threaded & Grooved Pipe","q":"Why are pipe threads tapered?","a":"To tighten and seal in the fitting"},{"m":"Threaded & Grooved Pipe","q":"Standard pipe thread taper?","a":"3/4 inch per foot"},{"m":"Threaded & Grooved Pipe","q":"Define throw on a fitting.","a":"Centre-to-face distance"},{"m":"Threaded & Grooved Pipe","q":"Five pipe measurement methods?","a":"Centre-to-Centre, End-to-End, End-to-End Overall, End-to-Centre, Face-to-Face"},{"m":"Threaded & Grooved Pipe","q":"Difference between a coupling and a thread protector?","a":"Couplings are tapered; protectors are parallel"},{"m":"Threaded & Grooved Pipe","q":"Four reasons for using thread cutting oil?","a":"Cool, flush chips, lubricate, improve finish"},{"m":"Threaded & Grooved Pipe","q":"Three problems caused by internal pipe burrs?","a":"Pressure loss, erosion, blockage"},{"m":"Threaded & Grooved Pipe","q":"Is galvanized coating retained after threading?","a":"No. Threading removes the zinc coating"},{"m":"Threaded & Grooved Pipe","q":"Accepted procedure for making threaded joints?","a":"Measure, Mark, Cut, Ream, Oil & Thread, Clean/Compound/Tighten"},{"m":"Threaded & Grooved Pipe","q":"Why is jointing compound applied?","a":"Lubricates threads and helps sealing"},{"m":"Threaded & Grooved Pipe","q":"Which thread receives the compound?","a":"Male thread only"},{"m":"Threaded & Grooved Pipe","q":"Why only the male thread?","a":"To prevent compound from entering the piping system"},{"m":"Threaded & Grooved Pipe","q":"Spiral fluted reamer is used with?","a":"Hand operation only"},{"m":"Threaded & Grooved Pipe","q":"Straight fluted reamer can be used with?","a":"Hand or power operation"},{"m":"Threaded & Grooved Pipe","q":"Threading lubricant for copper?","a":"Mineral oil, lard, or tallow"},{"m":"Threaded & Grooved Pipe","q":"Threading lubricant for stainless steel?","a":"High sulphur content oil"},{"m":"Threaded & Grooved Pipe","q":"Threading lubricant for brass?","a":"Soapy water"},{"m":"Threaded & Grooved Pipe","q":"Threading lubricant for steel/wrought iron?","a":"Thread cutting oil"},{"m":"Threaded & Grooved Pipe","q":"What are fittings used for?","a":"Changes in direction, branches, or joining pipe sections"},{"m":"Threaded & Grooved Pipe","q":"Four common methods of joining pipe?","a":"Threaded, Flanged, Welded, Grooved"},{"m":"Threaded & Grooved Pipe","q":"Two main steel pipe cutter types?","a":"Single-wheel and Multi-wheel"},{"m":"Threaded & Grooved Pipe","q":"Advantage of a single-wheel cutter?","a":"Small outer burrs"},{"m":"Threaded & Grooved Pipe","q":"Advantage of a multi-wheel cutter?","a":"Works in tight spaces"},{"m":"Threaded & Grooved Pipe","q":"Disadvantage of a single-wheel cutter?","a":"Requires full 360° rotation"},{"m":"Threaded & Grooved Pipe","q":"Disadvantage of a multi-wheel cutter?","a":"Large burrs; may spiral on pipe"},{"m":"Threaded & Grooved Pipe","q":"What effect does an external cutting ridge have?","a":"Makes dies difficult to start"},{"m":"Threaded & Grooved Pipe","q":"How is the ridge removed?","a":"With a file"},{"m":"Threaded & Grooved Pipe","q":"First thread cut by the dies is the ______ thread.","a":"Deepest"},{"m":"Threaded & Grooved Pipe","q":"As pipe size increases, threads per inch generally ______.","a":"Decrease"},{"m":"Threaded & Grooved Pipe","q":"Shallow threads make fittings ______ to start.","a":"Harder"},{"m":"Threaded & Grooved Pipe","q":"All pipe fittings have a ______ thread.","a":"Tapered"},{"m":"Threaded & Grooved Pipe","q":"Standard pipe threads are ______ hand threads.","a":"Right-hand"},{"m":"Threaded & Grooved Pipe","q":"Fittings are screwed on by turning ______.","a":"Clockwise"},{"m":"Threaded & Grooved Pipe","q":"Torn or imperfect threads can result in ______ joints.","a":"Leaking"},{"m":"Threaded & Grooved Pipe","q":"Threading torch-cut pipe will ______ die life.","a":"Shorten"},{"m":"Threaded & Grooved Pipe","q":"The thread applied to pipe or fittings is a ______ thread.","a":"Tapered"},{"m":"Threaded & Grooved Pipe","q":"Perfect and imperfect threads differ because imperfect threads are ______.","a":"Imperfect on top and bottom"},{"m":"Threaded & Grooved Pipe","q":"Insufficient cutting oil causes ______ threads.","a":"Torn or broken"},{"m":"Threaded & Grooved Pipe","q":"Improperly adjusted dies result in a thread that is ______.","a":"Too loose or too tight"},{"m":"Tube & Tubing","q":"What color code identifies Type DWV copper tube?","a":"Yellow"},{"m":"Tube & Tubing","q":"What color code identifies Type L copper tube?","a":"Blue"},{"m":"Tube & Tubing","q":"What color code identifies Type K copper tube?","a":"Green"},{"m":"Tube & Tubing","q":"What color code identifies Type M copper tube?","a":"Red"},{"m":"Tube & Tubing","q":"Three advantages of copper over steel pipe?","a":"Malleability, Ductility, Corrosion Resistance"},{"m":"Tube & Tubing","q":"Wall thickness of 1/2 inch Type K copper tube?","a":"0.049 inches"},{"m":"Tube & Tubing","q":"Wall thickness of 1/2 inch Type L copper tube?","a":"0.040 inches"},{"m":"Tube & Tubing","q":"Wall thickness of 1/2 inch Type M copper tube?","a":"0.028 inches"},{"m":"Tube & Tubing","q":"Three applications of DWV copper tube?","a":"Drains, Wastes, Vents"},{"m":"Tube & Tubing","q":"Three applications of Type K copper tube?","a":"Water service lines, Gasfitting, Water distribution systems"},{"m":"Tube & Tubing","q":"Type L copper tube applications in the gas industry?","a":"Below-grade piping if factory coated; above-ground systems up to 1 1/4 inch NPS"},{"m":"Tube & Tubing","q":"Type L copper tube applications in plumbing?","a":"DWV, water service, and water distribution"},{"m":"Tube & Tubing","q":"Main application of Type M copper tube?","a":"Residential and light commercial water and heating lines"},{"m":"Tube & Tubing","q":"Difference between soft temper and hard temper copper tube?","a":"Soft copper can be bent without special bending tools"},{"m":"Tube & Tubing","q":"Greatest disadvantage of copper compared to steel?","a":"Higher rate of expansion"},{"m":"Tube & Tubing","q":"Sizes in which DWV tube is manufactured?","a":"1 1/4 inch through 6 inch, in straight lengths of 12 ft to 20 ft, hard temper only"},{"m":"Tube & Tubing","q":"Minimum size of Type M tube?","a":"1/4 inch"},{"m":"Tube & Tubing","q":"Minimum size of Type K tube?","a":"1/4 inch"},{"m":"Tube & Tubing","q":"Minimum size of Type L tube?","a":"1/4 inch"},{"m":"Tube & Tubing","q":"Minimum size of Type DWV tube?","a":"1 1/4 inch"},{"m":"Tube & Tubing","q":"Essential difference between oxygen tube and regular Type K/L tube?","a":"Oxygen tube is cleaned and capped"},{"m":"Tube & Tubing","q":"What does 99.7% pure copper mean?","a":"Copper contains only 0.3% impurities"},{"m":"Tube & Tubing","q":"Copper alloy: Yellow Brass composition?","a":"66% copper, 34% zinc"},{"m":"Tube & Tubing","q":"Copper alloy: Red Brass composition?","a":"85% copper, 15% zinc"},{"m":"Tube & Tubing","q":"Copper alloy: Bronze composition?","a":"90% copper, 10% tin"},{"m":"Tube & Tubing","q":"Which copper tube types are recognized by SPS?","a":"Types K, L, and M"},{"m":"Tube & Tubing","q":"Copper's coefficient of thermal expansion?","a":"0.0000171/°C or 0.0000095/°F"},{"m":"Tube & Tubing","q":"Chemical symbol for copper?","a":"Cu"},{"m":"Tube & Tubing","q":"How is copper pipe measured?","a":"By approximate inside diameter up to 12 inch NPS; by actual OD for 14 inch and larger"},{"m":"Tube & Tubing","q":"How is copper tube measured?","a":"By approximate inside diameter or NPS"},{"m":"Tube & Tubing","q":"How is copper tubing measured?","a":"By actual outside diameter and wall thickness"},{"m":"Tube & Tubing","q":"Most common joining method for copper tube?","a":"Soldering"},{"m":"Tube & Tubing","q":"Acceptable methods of joining copper tube?","a":"Soldering, Flared fittings, Compression fittings, Brazing, Press-connect"},{"m":"Tube & Tubing","q":"What does a Tylok fitting use in addition to the fitting body?","a":"An additional ferrule"},{"m":"Tube & Tubing","q":"What flare angle is commonly used for copper tubing?","a":"45°"},{"m":"Tube & Tubing","q":"Acceptable copper tube benders?","a":"Lever, Mechanical, and Gear benders"},{"m":"Tube & Tubing","q":"Best bender for larger copper tube sizes?","a":"Mechanical type"},{"m":"Plastic Pipe and Tube","q":"The type of plastic that becomes soft when heated and hard when cooled is known as what?","a":"Thermoplastic"},{"m":"Plastic Pipe and Tube","q":"Name five advantages of plastic pipe over ferrous pipe.","a":"Resistant to chemicals, unaffected by corrosion, high corrosion resistance, smoother bore with less friction loss, absorbs vibration and shock, economical, easy joining, light weight, easily prefabricated, low absorption rate"},{"m":"Plastic Pipe and Tube","q":"Name three disadvantages of plastic pipe compared to metal pipe.","a":"High coefficient of expansion, low tensile strength, creep, deformation under load, low heat resistance, low ductility, low fire resistance"},{"m":"Plastic Pipe and Tube","q":"The plastic pipe used for underground gas lines is what?","a":"High-density polyethylene"},{"m":"Plastic Pipe and Tube","q":"Minimum surface temperature recommended for solvent cementing plastic pipe and fittings?","a":"5°C or 40°F"},{"m":"Plastic Pipe and Tube","q":"The colour of polypropylene DWV pipes and fittings is determined by what?","a":"The manufacturer"},{"m":"Plastic Pipe and Tube","q":"What type of plastic is very similar to polypropylene and is blue in colour?","a":"Proxylene"},{"m":"Plastic Pipe and Tube","q":"What does nesting of pipe refer to?","a":"Storage of pipe with smaller sizes inside larger pipe"},{"m":"Plastic Pipe and Tube","q":"Underground drainage systems are primarily joined with what type of joints?","a":"Bell-type joints"},{"m":"Plastic Pipe and Tube","q":"Name three plastic materials best suited for acid waste and vents.","a":"Polyethylene, Polypropylene, Proxylene"},{"m":"Plastic Pipe and Tube","q":"Name three methods of joining plastic pipe and fittings using heat.","a":"Butt fusion welding, socket fusion welding, electric resistant fusion, hot air fillet weld"},{"m":"Plastic Pipe and Tube","q":"Plastic acid waste pipes may be joined by what two methods?","a":"Fusion welds and acid-resistant mechanical joints"},{"m":"Plastic Pipe and Tube","q":"What is used to check the temperature of plastic for fusion welding?","a":"Temp-sticks"},{"m":"Plastic Pipe and Tube","q":"The two types of plastic tube best suited for radiant panel heating are what?","a":"PEX and PE/AL/PE"},{"m":"Plastic Pipe and Tube","q":"The types of plastic pipe most suitable for hot water heating systems are what?","a":"PEX and PE/AL/PE"},{"m":"Plastic Pipe and Tube","q":"When connecting plastic pipe to metal pipe with a threaded connection, the plastic must have what thread?","a":"MIP thread"},{"m":"Plastic Pipe and Tube","q":"List three plastics that can be joined with solvent cement.","a":"ABS, PVC, CPVC"},{"m":"Plastic Pipe and Tube","q":"What type of light rays can cause deterioration of plastics?","a":"UV light rays"},{"m":"Plastic Pipe and Tube","q":"Solvent cement that starts to gel must be handled how?","a":"It must not be used and must be disposed of safely and properly"},{"m":"Plastic Pipe and Tube","q":"Before butt welding plastic pipe and fittings, what must you ensure about the pipe ends?","a":"The pipe ends are square"},{"m":"Plastic Pipe and Tube","q":"Before applying solvent cement on PVC pipe and fittings, what must you use?","a":"Cleaner/primer"},{"m":"Plastic Pipe and Tube","q":"Which plastics produce toxic gases?","a":"PVC and CPVC"},{"m":"Plastic Pipe and Tube","q":"A 200 mm or 8 inch solvent-cemented joint at 10°C or 50°F requires what cure time before pressure testing?","a":"12 to 48 hours"},{"m":"Plastic Pipe and Tube","q":"What is used to keep plastic pipe round when threading?","a":"A round wooden plug inserted into the pipe end"},{"m":"Valves","q":"What four conditions/factors must be considered when selecting a valve?","a":"Pressure, temperature, flow rate, and type of fluid."},{"m":"Valves","q":"What are check valves designed to prevent?","a":"Back-flow."},{"m":"Valves","q":"What are two types of check valves?","a":"Lift check and swing check."},{"m":"Valves","q":"What is a globe valve commonly used for?","a":"Throttling flow."},{"m":"Valves","q":"What is valve/fitting equivalent length?","a":"Pressure loss caused by the valve or fitting in relationship to a length of pipe."},{"m":"Valves","q":"What is the most widely used valve in industry?","a":"Ball valve."},{"m":"Valves","q":"Why is the ball valve widely used?","a":"High flow rate, quick and easy operation, simple design, and less maintenance."},{"m":"Valves","q":"What is the proper valve stem position?","a":"With the stem upright."},{"m":"Valves","q":"What does NRS stand for?","a":"Non-rising stem."},{"m":"Valves","q":"What does RS stand for?","a":"Rising stem."},{"m":"Valves","q":"What does AWWA stand for?","a":"American Water Works Association."},{"m":"Valves","q":"What does 125 WOG mean?","a":"125 psi maximum operating pressure for water, oil, or gas."},{"m":"Valves","q":"What does 125 SWP mean?","a":"125 psi maximum operating pressure for steam."},{"m":"Valves","q":"What is a ball valve used for?","a":"To start and stop the flow of fluids."},{"m":"Valves","q":"Why does a non-rising stem valve require less headroom?","a":"It requires less headroom to operate."},{"m":"Valves","q":"Identify the valves in Figure 14.","a":"A: Straight Globe Valve. B: Swing Check. C: Gate Valve. D: Ball Valve. E: Angle Globe. F: Lift Check Valve."},{"m":"Valves","q":"What is the main advantage of an outside screw and yoke valve?","a":"Threads do not come in contact with fluids."},{"m":"Valves","q":"What is the main advantage of a non-rising stem valve?","a":"Less headroom."},{"m":"Valves","q":"What is the main advantage of a diaphragm valve?","a":"No packing and less maintenance."},{"m":"Valves","q":"What is the main advantage of a lantern ring?","a":"Better lubrication."},{"m":"Valves","q":"What is the main advantage of composition discs?","a":"Easily replaced to accommodate other applications."},{"m":"Valves","q":"What is the main advantage of Y-pattern valves?","a":"Pressure loss kept to a minimum."},{"m":"Valves","q":"What is the main advantage of rising stem valves?","a":"Easy to tell if the valve is open or closed."},{"m":"Valves","q":"What is the main advantage of needle valves?","a":"Very fine throttling at high pressures."},{"m":"Valves","q":"What is the main advantage of ball valves?","a":"Quick response and low maintenance."},{"m":"Valves","q":"Valves that require only a 90° turn are classified as what?","a":"1/4 turn valves."},{"m":"Valves","q":"What is the S or SWP rating on a valve related to?","a":"Maximum pressure allowed at saturation steam temperature."},{"m":"Valves","q":"What damage can occur to a non-lubricated metal-to-metal plug valve under high pressure?","a":"Galling."},{"m":"Valves","q":"What condition would most likely require a tilting disc check valve?","a":"Low-velocity flow."},{"m":"Valves","q":"What does an OS&Y valve refer to?","a":"Outside screw and yoke."},{"m":"Valves","q":"List two major advantages of the OS&Y valve.","a":"Stem threads do not contact fluid, and it is easier to maintain and lubricate."},{"m":"Valves","q":"What is the purpose of a stuffing box?","a":"To hold packing that prevents fluid leakage."},{"m":"Valves","q":"What is the purpose of a packing nut?","a":"To hold the packing gland and packing."},{"m":"Valves","q":"What is the purpose of a packing gland?","a":"To compress the packing."},{"m":"Valves","q":"What is the purpose of a lantern ring?","a":"To lubricate the valve stem."},{"m":"Valves","q":"What special feature might be required for a gate valve in a vertical line?","a":"Drain valve tapping above the disc."},{"m":"Valves","q":"What flow condition can a spring-loaded check valve reduce?","a":"Water hammer."},{"m":"Valves","q":"What is required before removing a component from a system in most plants?","a":"Safe work permit."},{"m":"Valves","q":"Correct packing size for a 25 mm stem and 44 mm stuffing box?","a":"9.5 mm or 3/8 inch."},{"m":"Valves","q":"Which group is at the forefront in setting valve standards?","a":"MSS."},{"m":"Valves","q":"Why would B31.3 piping require an API 6D valve?","a":"A bubble-tight seal is required between the disc and seats."},{"m":"Tube & Tubing","q":"Does Type K copper tube have the thickest of the five types of copper tube? True or False","a":"True. Type K copper tube has the thickest wall of the five types of copper tube and is available in sizes 1/4 inch to 12 inch, either hard-tempered straight lengths of 12 ft to 20 ft or soft coils."},{"m":"Tube & Tubing","q":"What is the definition of annealing?","a":"To heat and then cool, which softens the copper and makes it more flexible."},{"m":"Tube & Tubing","q":"What is the definition of a compression fitting?","a":"A fitting designed to join tube by means of pressure or friction. This type of joint uses a ferrule and nut."},{"m":"Tube & Tubing","q":"What is the definition of hard temper tube?","a":"Generally recommended for exposed lines, such as hot and cold water supplies to fixtures or any lines suspended on hangers. The rigidity of hard temper tube resists sagging and deflection stresses between supports."},{"m":"Tube & Tubing","q":"What is the definition of flaring?","a":"To spread the end of tubing."},{"m":"Tube & Tubing","q":"What is the definition of soft temper tube?","a":"Preferred for lines buried underground or laid in floors because of its flexibility. This flexibility, or annealing, allows the tube to move or flex if ground movement occurs."},

// Convert simple Q/A cards into quiz cards with smarter answer choices.
// Wrong answers are chosen by topic similarity so they feel closer to the question.
const STOPWORDS = new Set("a an and are as at be by can for from has have how in into is it its name no of on or over should that the their this to true used what when where which why with would does do must before after above below only most common list three four five two one".split(" "));

function cleanText(s){return String(s).toLowerCase().replace(/[^a-z0-9°./#&-]+/g," ").trim();}
function hasWord(text, word){return cleanText(text).split(/s+/).includes(word);}
function uniquePush(arr, val){if(val && !arr.includes(val))arr.push(val);}
function shuffleChoices(correct, wrongs){
    let choices=[correct,...wrongs.slice(0,3)];
    for(let i=choices.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[choices[i],choices[j]]=[choices[j],choices[i]];}
    return {choices:choices,a:choices.indexOf(correct)};
}
function looksLikeTrueFalse(q,a){
    let t=String(a).toLowerCase().trim();
    return t.startsWith("true")||t.startsWith("false")||cleanText(q).includes("true or false");
}

function pickRelatedWrongAnswers(card, idx){
    let moduleName=card.module||card.m, q=cleanText(card.q), a=String(card.a), wrongs=[];
    let manual=smartManualWrongAnswers(card);
    if(manual) return manual;

    // For list answers, prefer other list answers in the same module with similar wording.
    let wantsList = a.includes(",") || a.includes(" and ") || q.includes("list") || q.includes("name three") || q.includes("name five") || q.includes("four common") || q.includes("accepted procedure");
    let cards = RAW_CARDS.map((x,i)=>({x,i,module:x.module||x.m})).filter(o=>o.i!==idx && String(o.x.a)!==a && !looksLikeTrueFalse(o.x.q,o.x.a));
    function score(o){
        let oq=cleanText(o.x.q), oa=cleanText(o.x.a); let s=0;
        if(o.module===moduleName) s+=60;
        let qt=q.split(/s+/).filter(w=>w.length>3); let combined=oq+" "+oa;
        for(let w of qt){ if(combined.includes(w)) s+=6; }
        if(q.includes("advantage") && oq.includes("advantage")) s+=25;
        if(q.includes("disadvantage") && oq.includes("disadvantage")) s+=25;
        if(q.includes("purpose") && oq.includes("purpose")) s+=20;
        if(q.includes("used for") && (oq.includes("used for")||oq.includes("application"))) s+=18;
        if(q.includes("rated") && oq.includes("rated")) s+=18;
        if(q.includes("sized") && oq.includes("sized")) s+=18;
        if(q.includes("thread") && oq.includes("thread")) s+=18;
        if(q.includes("valve") && (oq.includes("valve")||oa.includes("valve"))) s+=15;
        if(q.includes("copper") && (oq.includes("copper")||oa.includes("copper"))) s+=15;
        if(q.includes("plastic") && (oq.includes("plastic")||oa.includes("plastic"))) s+=15;
        if(q.includes("pipe") && (oq.includes("pipe")||oa.includes("pipe"))) s+=10;
        if(wantsList && String(o.x.a).includes(",")) s+=20;
        // Keep answer type similar.
        if(/^d/.test(a) && /^d/.test(String(o.x.a))) s+=20;
        return s;
    }
    cards.sort((x,y)=>score(y)-score(x));
    for(let o of cards){
        if(wrongs.length>=3) break;
        let ans=String(o.x.a);
        if(ans!==a && !wrongs.includes(ans)) wrongs.push(ans);
    }

    // Safe fallback, still topic-related.
    if(wrongs.length<3){
        let f={
            "Hand Tools":["A similar hand tool used for a different layout task","A related measuring tool used for a different check","A clamping or cutting tool used for a different operation"],
            "Power Tools":["A similar power-tool procedure used for a different operation","A related safety check that does not answer this question","A different machine setting used for another tool"],
            "Welded Pipe & Fittings":["A similar fitting allowance for a different fitting","A related flange or gasket detail for another joint","A different pipe-fitup step from the same procedure"],
            "Threaded & Grooved Pipe":["A related thread term that describes a different feature","A similar pipe measurement used for a different calculation","A different pipe joining method"],
            "Tube & Tubing":["A different copper tube type or application","A similar copper joining method used in another situation","A related copper measurement that does not match this question"],
            "Plastic Pipe and Tube":["A different plastic joining method","A related plastic material used for another service","A similar storage or installation rule for another pipe type"],
            "Valves":["A different valve feature used for another service","A related valve rating that means something else","A similar valve type used for a different flow condition"]
        }[moduleName]||["A related answer from the same module","A similar trade term with a different meaning","A nearby procedure that does not fit this question"];
        for(let x of f) uniquePush(wrongs,x);
    }
    return wrongs.slice(0,3);
}
function makeSmartChoices(card, idx){
    let moduleName=card.module||card.m;
    if(card.choices && typeof card.a==="number") return {module:moduleName,q:card.q,choices:card.choices,a:card.a,img:card.img||""};
    if(looksLikeTrueFalse(card.q,card.a)){
        let correctText=String(card.a).toLowerCase().startsWith("true")?"True":"False";
        let choices=["True","False"];
        return {module:moduleName,q:card.q,choices:choices,a:choices.indexOf(correctText),img:card.img||""};
    }
    let wrongs=pickRelatedWrongAnswers(card,idx);
    let mixed=shuffleChoices(card.a,wrongs);
    return {module:moduleName,q:card.q,choices:mixed.choices,a:mixed.a,img:card.img||""};
}

let deck=[...ALL_CARDS],index=0,correct=0,answered={};
let autoStudy=localStorage.getItem("equipAutoStudy")==="1";
let flipTimer=null;
let nextTimer=null;
const $=id=>document.getElementById(id);

function init(){
    updateAudioUI();
    updateAutoStudyUI();
    let modules=["All Modules",...new Set(ALL_CARDS.map(c=>c.module))];
    $("moduleFilter").innerHTML=modules.map(m=>`<option>${m}</option>`).join("");
    $("moduleFilter").onchange=filterDeck;
    $("mode").onchange=function(){
        stopAutoStudyTimers();
        render();
    };
    render();
}

function filterDeck(){
    let m=$("moduleFilter").value;
    deck=m==="All Modules"?[...ALL_CARDS]:ALL_CARDS.filter(c=>c.module===m);
    index=0;
    resetScore(false);
    render();
}

function addEndPunctuation(t){
    t=String(t).trim();
    if(!t)return t;
    return /[?!.]$/.test(t)?t:t+".";
}

function render(){
    if(!deck.length)return;
    stopAutoStudyTimers();
    let c=deck[index], study=$("mode").value==="study";
    $("moduleName").textContent=c.module;
    $("counter").textContent=`Question ${index+1} of ${deck.length}`;
    $("num").textContent=index+1;
    $("total").textContent=deck.length;
    $("feedback").textContent="";
    $("answerBox").style.display="none";
    $("quizArea").style.display=study?"none":"block";
    $("studyArea").style.display=study?"block":"none";
    $("flipCard").classList.remove("flipped");
    let imgHtml=c.img?'<img class="qimg" src="'+c.img+'" alt="Question image">':'';
    $("studyQ").innerHTML=esc(addEndPunctuation(c.q))+imgHtml;
    $("studyA").textContent=addEndPunctuation(c.choices[c.a]);
    $("question").innerHTML=esc(addEndPunctuation(c.q))+imgHtml;
    buildChoices(c);
    updateStats();
    if(study && autoStudy){
        startAutoStudy();
    }else{
        speakQuestion(false);
    }
}

function buildChoices(c){
    let h=$("choices");
    h.innerHTML="";
    c.choices.forEach((ch,i)=>{
        let b=document.createElement("button");
        b.className="choice";
        b.textContent=String.fromCharCode(97+i)+") "+addEndPunctuation(ch);
        b.onclick=()=>choose(i);
        h.appendChild(b);
    });
    if(answered[index]!==undefined)markChoices(answered[index]);
}

function choose(i){
    if($("mode").value==="study")return flipStudyCard();
    if(answered[index]!==undefined)return;
    answered[index]=i;
    if(i===deck[index].a)correct++;
    markChoices(i);
    showAnswer();
    speakResult(i,false);
    updateStats();
}

function markChoices(chosen){
    let c=deck[index],bs=document.querySelectorAll(".choice");
    bs.forEach((b,i)=>{
        b.disabled=true;
        if(i===c.a)b.classList.add("correct");
        if(i===chosen&&i!==c.a)b.classList.add("wrong");
    });
    $("feedback").textContent=chosen===c.a?"Correct":"Incorrect";
}

function showAnswer(){
    let c=deck[index];
    if($("mode").value==="study"){
        clearTimeout(flipTimer);
        $("flipCard").classList.add("flipped");
        speakAnswer(false);
        return;
    }
    $("answerBox").innerHTML="<b>Correct Answer:</b> "+String.fromCharCode(97+c.a)+") "+esc(addEndPunctuation(c.choices[c.a]));
    $("answerBox").style.display="block";
}

function flipStudyCard(){
    stopAutoStudyTimers();
    $("flipCard").classList.toggle("flipped");
    speakCurrentCard(false);
}

function updateAutoStudyUI(){
    if($("autoStudyBtn")) $("autoStudyBtn").textContent=autoStudy?"⏱️ Auto Study On":"⏱️ Auto Study Off";
}

function stopAutoStudyTimers(){
    clearTimeout(flipTimer);
    clearTimeout(nextTimer);
    flipTimer=null;
    nextTimer=null;
}

function toggleAutoStudy(){
    autoStudy=!autoStudy;
    localStorage.setItem("equipAutoStudy",autoStudy?"1":"0");
    updateAutoStudyUI();
    stopAutoStudyTimers();
    render();
}

function startAutoStudy(){
    stopAutoStudyTimers();
    if(!autoStudy || $("mode").value!=="study") return;
    $("flipCard").classList.remove("flipped");

    // Speech must finish first. Then the 3-second flip timer begins.
    speakQuestion(false,()=>{
        if(!autoStudy || $("mode").value!=="study") return;
        flipTimer=setTimeout(()=>{
            if(!autoStudy || $("mode").value!=="study") return;
            $("flipCard").classList.add("flipped");

            // Answer speech must finish first. Then the 5-second next-card timer begins.
            speakAnswer(false,()=>{
                if(!autoStudy || $("mode").value!=="study") return;
                nextTimer=setTimeout(()=>{
                    if(autoStudy && $("mode").value==="study") nextCard();
                },5000);
            });
        },3000);
    });
}

function nextCard(){index=(index+1)%deck.length;render();}
function prevCard(){index=(index-1+deck.length)%deck.length;render();}

function shuffleDeck(){
    for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
    index=0;
    resetScore(false);
    render();
}

function resetScore(r=true){
    correct=0;
    answered={};
    if(r)render();
    updateStats();
}

function updateStats(){
    let done=Object.keys(answered).length;
    $("right").textContent=correct;
    $("done").textContent=done;
    $("left").textContent=deck.length-done;
}

function esc(s){
    return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

function audioCleanText(t){
    let text=String(t);
    text=text.replace(/_{3,}/g,"|||PAUSE3|||");
    text=text
        .replace(/\bPSIA\b/gi,"P.S.I.A")
        .replace(/\bPSIG\b/gi,"P.S.I.G")
        .replace(/\bPSI\b/gi,"P.S.I")
        .replace(/\bWC\b/gi,"Water Column")
        .replace(/\bIMP\b/gi,"Imperial")
        .replace(/\bGAL\b/gi,"Gallon")
        .replace(/\bNPS\b/gi,"N.P.S")
        .replace(/\bTPI\b/gi,"T.P.I")
        .replace(/\bOD\b/gi,"O.D")
        .replace(/\bID\b/gi,"I.D")
        .replace(/\bMJ\b/gi,"M.J")
        .replace(/\bRFWN\b/gi,"R.F.W.N")
        .replace(/\bRPM\b/gi,"R.P.M");
    text=text
        .replace(/(\d)\s*×\s*(\d)/g,"$1 multiply $2")
        .replace(/(\d)\s*[xX]\s*(\d)/g,"$1 multiply $2")
        .replace(/(\d)\s*÷\s*(\d)/g,"$1 divide $2")
        .replace(/(\d)\s*\+\s*(\d)/g,"$1 add $2")
        .replace(/(\d)\s*-\s*(\d)/g,"$1 subtract $2");
    text=text.replace(/([A-Za-z])-([A-Za-z])/g,"$1 $2");
    text=text
        .replace(/[.!?:;,]/g," ")
        .replace(/\s+/g," ")
        .trim();
    return text;
}

function speakText(text,force=false,onDone=null){
    if(!force&&!audioOn){ if(onDone) onDone(); return; }
    if(!("speechSynthesis" in window)){ if(onDone) onDone(); return; }
    speechSynthesis.cancel();
    const cleaned=audioCleanText(text);
    const parts=cleaned.split("|||PAUSE3|||");

    function finish(){ if(onDone) onDone(); }
    function speakPart(i){
        if(i>=parts.length){ finish(); return; }
        const part=parts[i].trim();
        if(!part){
            if(i<parts.length-1) setTimeout(()=>speakPart(i+1),3000);
            else finish();
            return;
        }
        const utter=new SpeechSynthesisUtterance(part);
        utter.rate=.85;
        utter.pitch=1;
        utter.volume=1;
        let vs=speechSynthesis.getVoices();
        let v=vs.find(x=>x.lang&&x.lang.toLowerCase().startsWith("en"));
        if(v)utter.voice=v;
        utter.onend=()=>{
            if(i<parts.length-1) setTimeout(()=>speakPart(i+1),3000);
            else finish();
        };
        utter.onerror=finish;
        speechSynthesis.speak(utter);
    }
    speakPart(0);
}

function ansLabel(c){return c.choices[c.a];}
function speakQuestion(force=false,onDone=null){let c=deck[index];speakText(addEndPunctuation(c.q),force,onDone);}
function speakAnswer(force=false,onDone=null){let c=deck[index];speakText(addEndPunctuation(ansLabel(c)),force,onDone);}
function speakResult(chosen,force=false){
    let c=deck[index];
    let t=chosen===c.a?"Correct. ":"Incorrect. The correct answer is. ";
    speakText(t+addEndPunctuation(ansLabel(c)),force);
}
function speakCurrentCard(force=false){
    if($("mode").value==="study"&&$("flipCard").classList.contains("flipped"))speakAnswer(force);
    else speakQuestion(force);
}

document.onkeydown=e=>{
    if(e.key==="ArrowRight")nextCard();
    if(e.key==="ArrowLeft")prevCard();
    if(e.key===" "||e.key==="Enter"){e.preventDefault();showAnswer();}
};

function goHome(){
    window.location.href = "https://jpaulsen-study.github.io/sait-study-hub/";
}

init();
