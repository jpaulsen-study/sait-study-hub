icient of expansion, low tensile strength, creep, deformation under load, low heat resistance, low ductility, low fire resistance"},{"m":"Plastic Pipe and Tube","q":"The plastic pipe used for underground gas lines is what?","a":"High-density polyethylene"},{"m":"Plastic Pipe and Tube","q":"Minimum surface temperature recommended for solvent cementing plastic pipe and fittings?","a":"5°C or 40°F"},{"m":"Plastic Pipe and Tube","q":"The colour of polypropylene DWV pipes and fittings is determined by what?","a":"The manufacturer"},{"m":"Plastic Pipe and Tube","q":"What type of plastic is very similar to polypropylene and is blue in colour?","a":"Proxylene"},{"m":"Plastic Pipe and Tube","q":"What does nesting of pipe refer to?","a":"Storage of pipe with smaller sizes inside larger pipe"},{"m":"Plastic Pipe and Tube","q":"Underground drainage systems are primarily joined with what type of joints?","a":"Bell-type joints"},{"m":"Plastic Pipe and Tube","q":"Name three plastic materials best suited for acid waste and vents.","a":"Polyethylene, Polypropylene, Proxylene"},{"m":"Plastic Pipe and Tube","q":"Name three methods of joining plastic pipe and fittings using heat.","a":"Butt fusion welding, socket fusion welding, electric resistant fusion, hot air fillet weld"},{"m":"Plastic Pipe and Tube","q":"Plastic acid waste pipes may be joined by what two methods?","a":"Fusion welds and acid-resistant mechanical joints"},{"m":"Plastic Pipe and Tube","q":"What is used to check the temperature of plastic for fusion welding?","a":"Temp-sticks"},{"m":"Plastic Pipe and Tube","q":"The two types of plastic tube best suited for radiant panel heating are what?","a":"PEX and PE/AL/PE"},{"m":"Plastic Pipe and Tube","q":"The types of plastic pipe most suitable for hot water heating systems are what?","a":"PEX and PE/AL/PE"},{"m":"Plastic Pipe and Tube","q":"When connecting plastic pipe to metal pipe with a threaded connection, the plastic must have what thread?","a":"MIP thread"},{"m":"Plastic Pipe and Tube","q":"List three plastics that can be joined with solvent cement.","a":"ABS, PVC, CPVC"},{"m":"Plastic Pipe and Tube","q":"What type of light rays can cause deterioration of plastics?","a":"UV light rays"},{"m":"Plastic Pipe and Tube","q":"Solvent cement that starts to gel must be handled how?","a":"It must not be used and must be disposed of safely and properly"},{"m":"Plastic Pipe and Tube","q":"Before butt welding plastic pipe and fittings, what must you ensure about the pipe ends?","a":"The pipe ends are square"},{"m":"Plastic Pipe and Tube","q":"Before applying solvent cement on PVC pipe and fittings, what must you use?","a":"Cleaner/primer"},{"m":"Plastic Pipe and Tube","q":"Which plastics produce toxic gases?","a":"PVC and CPVC"},{"m":"Plastic Pipe and Tube","q":"A 200 mm or 8 inch solvent-cemented joint at 10°C or 50°F requires what cure time before pressure testing?","a":"12 to 48 hours"},{"m":"Plastic Pipe and Tube","q":"What is used to keep plastic pipe round when threading?","a":"A round wooden plug inserted into the pipe end"},{"m":"Valves","q":"What four conditions/factors must be considered when selecting a valve?","a":"Pressure, temperature, flow rate, and type of fluid."},{"m":"Valves","q":"What are check valves designed to prevent?","a":"Back-flow."},{"m":"Valves","q":"What are two types of check valves?","a":"Lift check and swing check."},{"m":"Valves","q":"What is a globe valve commonly used for?","a":"Throttling flow."},{"m":"Valves","q":"What is valve/fitting equivalent length?","a":"Pressure loss caused by the valve or fitting in relationship to a length of pipe."},{"m":"Valves","q":"What is the most widely used valve in industry?","a":"Ball valve."},{"m":"Valves","q":"Why is the ball valve widely used?","a":"High flow rate, quick and easy operation, simple design, and less maintenance."},{"m":"Valves","q":"What is the proper valve stem position?","a":"With the stem upright."},{"m":"Valves","q":"What does NRS stand for?","a":"Non-rising stem."},{"m":"Valves","q":"What does RS stand for?","a":"Rising stem."},{"m":"Valves","q":"What does AWWA stand for?","a":"American Water Works Association."},{"m":"Valves","q":"What does 125 WOG mean?","a":"125 psi maximum operating pressure for water, oil, or gas."},{"m":"Valves","q":"What does 125 SWP mean?","a":"125 psi maximum operating pressure for steam."},{"m":"Valves","q":"What is a ball valve used for?","a":"To start and stop the flow of fluids."},{"m":"Valves","q":"Why does a non-rising stem valve require less headroom?","a":"It requires less headroom to operate."},{"m":"Valves","q":"Identify the valves in Figure 14.","a":"A: Straight Globe Valve. B: Swing Check. C: Gate Valve. D: Ball Valve. E: Angle Globe. F: Lift Check Valve."},{"m":"Valves","q":"What is the main advantage of an outside screw and yoke valve?","a":"Threads do not come in contact with fluids."},{"m":"Valves","q":"What is the main advantage of a non-rising stem valve?","a":"Less headroom."},{"m":"Valves","q":"What is the main advantage of a diaphragm valve?","a":"No packing and less maintenance."},{"m":"Valves","q":"What is the main advantage of a lantern ring?","a":"Better lubrication."},{"m":"Valves","q":"What is the main advantage of composition discs?","a":"Easily replaced to accommodate other applications."},{"m":"Valves","q":"What is the main advantage of Y-pattern valves?","a":"Pressure loss kept to a minimum."},{"m":"Valves","q":"What is the main advantage of rising stem valves?","a":"Easy to tell if the valve is open or closed."},{"m":"Valves","q":"What is the main advantage of needle valves?","a":"Very fine throttling at high pressures."},{"m":"Valves","q":"What is the main advantage of ball valves?","a":"Quick response and low maintenance."},{"m":"Valves","q":"Valves that require only a 90° turn are classified as what?","a":"1/4 turn valves."},{"m":"Valves","q":"What is the S or SWP rating on a valve related to?","a":"Maximum pressure allowed at saturation steam temperature."},{"m":"Valves","q":"What damage can occur to a non-lubricated metal-to-metal plug valve under high pressure?","a":"Galling."},{"m":"Valves","q":"What condition would most likely require a tilting disc check valve?","a":"Low-velocity flow."},{"m":"Valves","q":"What does an OS&Y valve refer to?","a":"Outside screw and yoke."},{"m":"Valves","q":"List two major advantages of the OS&Y valve.","a":"Stem threads do not contact fluid, and it is easier to maintain and lubricate."},{"m":"Valves","q":"What is the purpose of a stuffing box?","a":"To hold packing that prevents fluid leakage."},{"m":"Valves","q":"What is the purpose of a packing nut?","a":"To hold the packing gland and packing."},{"m":"Valves","q":"What is the purpose of a packing gland?","a":"To compress the packing."},{"m":"Valves","q":"What is the purpose of a lantern ring?","a":"To lubricate the valve stem."},{"m":"Valves","q":"What special feature might be required for a gate valve in a vertical line?","a":"Drain valve tapping above the disc."},{"m":"Valves","q":"What flow condition can a spring-loaded check valve reduce?","a":"Water hammer."},{"m":"Valves","q":"What is required before removing a component from a system in most plants?","a":"Safe work permit."},{"m":"Valves","q":"Correct packing size for a 25 mm stem and 44 mm stuffing box?","a":"9.5 mm or 3/8 inch."},{"m":"Valves","q":"Which group is at the forefront in setting valve standards?","a":"MSS."},{"m":"Valves","q":"Why would B31.3 piping require an API 6D valve?","a":"A bubble-tight seal is required between the disc and seats."},{"m":"Tube & Tubing","q":"Does Type K copper tube have the thickest of the five types of copper tube? True or False","a":"True. Type K copper tube has the thickest wall of the five types of copper tube and is available in sizes 1/4 inch to 12 inch, either hard-tempered straight lengths of 12 ft to 20 ft or soft coils."},{"m":"Tube & Tubing","q":"What is the definition of annealing?","a":"To heat and then cool, which softens the copper and makes it more flexible."},{"m":"Tube & Tubing","q":"What is the definition of a compression fitting?","a":"A fitting designed to join tube by means of pressure or friction. This type of joint uses a ferrule and nut."},{"m":"Tube & Tubing","q":"What is the definition of hard temper tube?","a":"Generally recommended for exposed lines, such as hot and cold water supplies to fixtures or any lines suspended on hangers. The rigidity of hard temper tube resists sagging and deflection stresses between supports."},{"m":"Tube & Tubing","q":"What is the definition of flaring?","a":"To spread the end of tubing."},{"m":"Tube & Tubing","q":"What is the definition of soft temper tube?","a":"Preferred for lines buried underground or laid in floors because of its flexibility. This flexibility, or annealing, allows the tube to move or flex if ground movement occurs."}];

// Convert simple Q/A cards into quiz cards with answer choices.
// Each wrong choice is pulled from nearby cards in the same module when possible.
const ALL_CARDS = RAW_CARDS.map((card, idx) => {
    if(card.choices && typeof card.a === "number") return card;
    let same = RAW_CARDS.filter((x, i) => i !== idx && x.m === card.m && x.a !== card.a).map(x => x.a);
    let other = RAW_CARDS.filter((x, i) => i !== idx && x.a !== card.a).map(x => x.a);
    let wrongs = [];
    for(let x of same) if(!wrongs.includes(x) && wrongs.length < 3) wrongs.push(x);
    for(let x of other) if(!wrongs.includes(x) && wrongs.length < 3) wrongs.push(x);
    while(wrongs.length < 3) wrongs.push("Review the question again");
    let choices = [card.a, ...wrongs.slice(0,3)];
    for(let i=choices.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[choices[i],choices[j]]=[choices[j],choices[i]];}
    return {module:card.m, q:card.q, choices:choices, a:choices.indexOf(card.a)};
});

let deck=[...ALL_CARDS],index=0,correct=0,answered={};
const $=id=>document.getElementById(id);

function init(){
    updateAudioUI();
    let modules=["All Modules",...new Set(ALL_CARDS.map(c=>c.module))];
    $("moduleFilter").innerHTML=modules.map(m=>`<option>${m}</option>`).join("");
    $("moduleFilter").onchange=filterDeck;
    $("mode").onchange=render;
    render();
}

function filterDeck(){
    let m=$("moduleFilter").value;
    deck=m==="All Modules"?[...ALL_CARDS]:ALL_CARDS.filter(c=>c.module===m);
    index=0;
    resetScore(false);
    render();
}

function render(){
    if(!deck.length)return;
    let c=deck[index], study=$("mode").value==="study";
    $("moduleName").textContent=c.module;
    $("counter").textContent=`Question ${index+1} of ${deck.length}`;
    $("num").textContent=index+1;
    $("total").textContent=deck.length;
    $("feedback").textContent="";
    $("answerBox").style.display="none";
    $("quizArea").style.display=study?"none":"block";
    $("studyArea").style.display=study?"block":"none";
    $("flipCard").classList.remove("flipped");
    $("studyQ").textContent=c.q;
    $("studyA").textContent=c.choices[c.a];
    $("question").textContent=c.q;
    buildChoices(c);
    updateStats();
    setTimeout(()=>speakQuestion(false),250);
}

function buildChoices(c){
    let h=$("choices");
    h.innerHTML="";
    c.choices.forEach((ch,i)=>{
        let b=document.createElement("button");
        b.className="choice";
        b.textContent=String.fromCharCode(97+i)+") "+ch;
        b.onclick=()=>choose(i);
        h.appendChild(b);
    });
    if(answered[index]!==undefined)markChoices(answered[index]);
}

function choose(i){
    if($("mode").value==="study")return flipStudyCard();
    if(answered[index]!==undefined)return;
    answered[index]=i;
    if(i===deck[index].a)correct++;
    markChoices(i);
    showAnswer();
    speakResult(i,false);
    updateStats();
}

function markChoices(chosen){
    let c=deck[index],bs=document.querySelectorAll(".choice");
    bs.forEach((b,i)=>{
        b.disabled=true;
        if(i===c.a)b.classList.add("correct");
        if(i===chosen&&i!==c.a)b.classList.add("wrong");
    });
    $("feedback").textContent=chosen===c.a?"Correct":"Incorrect";
}

function showAnswer(){
    let c=deck[index];
    if($("mode").value==="study"){
        $("flipCard").classList.add("flipped");
        speakAnswer(false);
        return;
    }
    $("answerBox").innerHTML="<b>Correct Answer:</b> "+String.fromCharCode(97+c.a)+") "+esc(c.choices[c.a]);
    $("answerBox").style.display="block";
}

function flipStudyCard(){
    $("flipCard").classList.toggle("flipped");
    setTimeout(()=>speakCurrentCard(false),100);
}

function nextCard(){index=(index+1)%deck.length;render();}
function prevCard(){index=(index-1+deck.length)%deck.length;render();}

function shuffleDeck(){
    for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
    index=0;
    resetScore(false);
    render();
}

function resetScore(r=true){
    correct=0;
    answered={};
    if(r)render();
    updateStats();
}

function updateStats(){
    let done=Object.keys(answered).length;
    $("right").textContent=correct;
    $("done").textContent=done;
    $("left").textContent=deck.length-done;
}

function esc(s){
    return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

let audioOn=localStorage.getItem("equipAudioOn")==="1";

function updateAudioUI(){
    if($("audioStatus"))$("audioStatus").textContent=audioOn?"On":"Off";
    if($("audioBtn"))$("audioBtn").textContent=audioOn?"🔊 Audio On":"🔇 Audio Off";
}

function toggleAudio(){
    audioOn=!audioOn;
    localStorage.setItem("equipAudioOn",audioOn?"1":"0");
    if(!audioOn&&"speechSynthesis" in window)speechSynthesis.cancel();
    updateAudioUI();
    if(audioOn)speakCurrentCard(true);
}

function speakText(t,force=false){
    if(!force&&!audioOn)return;
    if(!("speechSynthesis" in window))return;
    t=String(t).replace(/\s*\?/g," ?");
    speechSynthesis.cancel();
    let u=new SpeechSynthesisUtterance(t);
    u.rate=.92;
    u.pitch=1;
    u.volume=1;
    let vs=speechSynthesis.getVoices();
    let v=vs.find(x=>x.lang&&x.lang.toLowerCase().startsWith("en"));
    if(v)u.voice=v;
    speechSynthesis.speak(u);
}

function ansLabel(c){return c.choices[c.a];}
function speakQuestion(force=false){let c=deck[index];speakText(c.q,force);}
function speakAnswer(force=false){let c=deck[index];speakText(ansLabel(c),force);}
function speakResult(chosen,force=false){
    let c=deck[index];
    let t=chosen===c.a?"Correct. ":"Incorrect. The correct answer is. ";
    speakText(t+ansLabel(c),force);
}
function speakCurrentCard(force=false){
    if($("mode").value==="study"&&$("flipCard").classList.contains("flipped"))speakAnswer(force);
    else speakQuestion(force);
}

document.onkeydown=e=>{
    if(e.key==="ArrowRight")nextCard();
    if(e.key==="ArrowLeft")prevCard();
    if(e.key===" "||e.key==="Enter"){e.preventDefault();showAnswer();}
};

function goHome(){
    window.location.href = "https://jpaulsen-study.github.io/sait-study-hub/";
}

init();
</script>
